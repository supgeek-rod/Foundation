# 起始页静态站点 nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # Vite 构建产物（文件名带内容 hash）：一年长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA 关键文件：禁止缓存，保证发版后立即生效
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 修正 manifest 的 Content-Type（部分 nginx 版本的 mime.types 未收录 webmanifest）
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # 其他图片 / 字体：一周缓存
    location ~* \.(?:png|jpe?g|gif|webp|avif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 入口页与前端路由回退：协商缓存
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
